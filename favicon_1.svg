<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded square backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- basket handle -->
  <path d="M20 27 C20 19, 44 19, 44 27"
        fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>

  <!-- basket body -->
  <path d="M16 27 H48 L45 46 a5 5 0 0 1 -5 4.3 h-14 a5 5 0 0 1 -5 -4.3 Z"
        fill="#ffffff" filter="url(#softShadow)"/>

  <!-- basket weave lines -->
  <path d="M22 32 L23.5 46 M32 32 L32 46.5 M42 32 L40.5 46"
        stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- leaf accent growing out of the basket -->
  <path d="M32 27 C29 20, 30 13, 37 10 C38.5 17, 36 24, 32 27 Z"
        fill="url(#leafGrad)"/>
  <path d="M32 27 C33.5 21, 35 16, 37 10" fill="none" stroke="#7c3aed" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
</svg>
