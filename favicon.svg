<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- storefront awning icon, scaled down and moved up -->
  <g fill="#ffffff" transform="translate(0,-40) scale(0.72)" transform-origin="256 256">
    <path d="M120 140 L140 70 L372 70 L392 140 Z" opacity="0.95"/>
    <rect x="128" y="150" width="256" height="16" rx="6"/>
    <path d="M132 166 h60 v70 a30 30 0 0 1 -30 30 a30 30 0 0 1 -30 -30 Z"/>
    <path d="M198 166 h60 v50 a30 30 0 0 1 -30 30 a30 30 0 0 1 -30 -30 Z" opacity="0.8"/>
    <path d="M264 166 h60 v50 a30 30 0 0 1 -30 30 a30 30 0 0 1 -30 -30 Z"/>
    <path d="M330 166 h60 v70 a30 30 0 0 1 -30 30 a30 30 0 0 1 -30 -30 Z" opacity="0.8"/>
  </g>

  <!-- "নাটোর" text in the middle/lower area, rendered by the viewer's browser -->
  <text x="256" y="400" text-anchor="middle"
        font-family="'Hind Siliguri','Noto Sans Bengali','Nikosh',sans-serif"
        font-size="92" font-weight="700" fill="#ffffff">নাটোর</text>
